# CronJob for master - downloads models from the internet
apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-syncer-master
  namespace: arc-systems
spec:
  # Run every Sunday at noon (12:00 PM)
  schedule: "0 12 * * 0"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: model-syncer-master
        spec:
          # Run only on master node
          nodeSelector:
            kubernetes.io/hostname: dls-arl-01
          imagePullSecrets:
          - name: ghcr-secret
          tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "runner"
            effect: "NoSchedule"
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 0  # Run as root to write to /home/runner/models
          containers:
          - name: syncer
            image: ghcr.io/open-edge-platform/dl-streamer-tests/dlstreamer-runner-ubuntu24:latest
            command: ["bash", "-c"]
            args:
              - |
                # Set HOME to runner user
                export HOME=/home/runner
                
                echo "--- MASTER: Starting download script ---"
                
                # Only remove old markers (older than 1 day) to avoid race condition
                # Workers rely on these files, so we keep them until we're ready to replace
                find /home/runner/models -name "SUCCESS.txt" -mtime +1 -delete 2>/dev/null || true
                find /home/runner/models -name "FAILED.txt" -mtime +1 -delete 2>/dev/null || true
                
                # Install required packages
                echo "Installing required packages..."
                apt-get update -qq && apt-get install -y -qq \
                  libgl1 \
                  libglib2.0-0 \
                  libgomp1 \
                  cmake \
                  build-essential \
                  python3-dev \
                  python3-venv \
                  > /dev/null 2>&1
                
                # Prepare log file (will be written to models_new and then synced to models)
                LOGFILE="/home/runner/models_new/sync.log"
                START_TIME=$(date '+%Y-%m-%d %H:%M:%S')
                
                # Create models_new directory early so we can write log there
                if [ -d /home/runner/models_new ]; then
                  rm -rf /home/runner/models_new
                fi
                mkdir -p /home/runner/models_new
                
                echo "=== Model Sync Started: $START_TIME ===" | tee $LOGFILE
                
                # Clone or update dlstreamer repository
                if [ ! -d "$HOME/dlstreamer" ]; then
                  echo "Cloning dlstreamer repository..." | tee -a $LOGFILE
                  git clone https://github.com/open-edge-platform/dlstreamer.git $HOME/dlstreamer 2>&1 | tee -a $LOGFILE
                else
                  echo "Updating dlstreamer repository..." | tee -a $LOGFILE
                  cd $HOME/dlstreamer
                  git pull 2>&1 | tee -a $LOGFILE
                fi

                # Download public models
                echo "Downloading public models..." | tee -a $LOGFILE
                export MODELS_PATH=/home/runner/models_new
                cd $HOME/dlstreamer/samples
                ./download_public_models.sh all coco128 2>&1 | tee -a $LOGFILE
                PUBLIC_STATUS=$?
                
                # Download OMZ models (using venv like in official workflow)
                echo "Downloading OMZ models..." | tee -a $LOGFILE
                echo "Setting up Python virtual environment..." | tee -a $LOGFILE
                mkdir -p $HOME/.virtualenvs/dlstreamer
                python3 -m venv $HOME/.virtualenvs/dlstreamer
                source $HOME/.virtualenvs/dlstreamer/bin/activate
                
                echo "Installing Python dependencies for OMZ..." | tee -a $LOGFILE
                pip3 install --no-cache-dir --upgrade tensorflow==2.19.1 openvino-dev[onnx]==2024.6.0 torch==2.8.0 2>&1 | tee -a $LOGFILE
                
                export MODELS_PATH=/home/runner/models_new
                ./download_omz_models.sh 2>&1 | tee -a $LOGFILE
                
                # Capture exit code before deactivate
                OMZ_STATUS=$?
                deactivate
                
                if [ $PUBLIC_STATUS -eq 0 ] && [ $OMZ_STATUS -eq 0 ]; then
                  echo "--- MASTER: Download successful, replacing models ---" | tee -a $LOGFILE
                  rsync -a --delete /home/runner/models_new/ /home/runner/models/ 2>&1 | tee -a $LOGFILE
                  rm -rf /home/runner/models_new
                  
                  # Clean up virtual environment
                  rm -rf $HOME/.virtualenvs
                  
                  # Create SUCCESS file with timestamp and summary
                  END_TIME=$(date '+%Y-%m-%d %H:%M:%S')
                  echo "SUCCESS" > /home/runner/models/SUCCESS.txt
                  echo "Started: $START_TIME" >> /home/runner/models/SUCCESS.txt
                  echo "Finished: $END_TIME" >> /home/runner/models/SUCCESS.txt
                  echo "Status: Completed successfully" >> /home/runner/models/SUCCESS.txt
                  echo "Log: sync.log" >> /home/runner/models/SUCCESS.txt
                  echo "--- MASTER: Update finished with SUCCESS ---" | tee -a $LOGFILE
                else
                  echo "--- MASTER: ERROR during download ---" | tee -a $LOGFILE
                  END_TIME=$(date '+%Y-%m-%d %H:%M:%S')
                  echo "Failed at: $END_TIME" | tee -a $LOGFILE
                  
                  # Clean up virtual environment
                  rm -rf $HOME/.virtualenvs
                  
                  # Copy log to models directory so workers can see what failed
                  cp /home/runner/models_new/sync.log /home/runner/models/ 2>/dev/null || true
                  
                  # Create FAILED marker so workers don't wait forever
                  echo "FAILED" > /home/runner/models/FAILED.txt
                  echo "Started: $START_TIME" >> /home/runner/models/FAILED.txt
                  echo "Failed: $END_TIME" >> /home/runner/models/FAILED.txt
                  echo "Status: Download failed - check sync.log for details" >> /home/runner/models/FAILED.txt
                  echo "Log: sync.log" >> /home/runner/models/FAILED.txt
                  echo "FAILED marker created" | tee -a /home/runner/models/sync.log
                  exit 1
                fi
            volumeMounts:
            - name: host-data
              mountPath: /home/runner/models
          volumes:
          - name: host-data
            hostPath:
              path: /home/runner/models
              type: DirectoryOrCreate
---
# CronJob for workers - synchronizes models from master
apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-syncer-workers
  namespace: arc-systems
spec:
  # Run every Sunday at 23:59 (11:59 PM)
  schedule: "59 23 * * 0"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # IMPORTANT: Set parallelism and completions to the number of worker nodes
      # kubectl get nodes -l dedicated=runner --field-selector metadata.name!=dls-arl-01 --no-headers | wc -l
      # Current setup: 7 worker nodes
      parallelism: 7
      completions: 7
      completionMode: Indexed
      template:
        metadata:
          labels:
            app: model-syncer-workers
        spec:
          # Run on any node EXCEPT master
          hostAliases:
          - ip: "10.173.191.71"
            hostnames:
            - "dls-arl-01"
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                    - dls-arl-01
                  - key: dedicated
                    operator: In
                    values:
                    - runner
            # Forces each pod to be on a DIFFERENT node
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                  - key: app
                    operator: In
                    values:
                    - model-syncer-workers
                topologyKey: kubernetes.io/hostname
          imagePullSecrets:
          - name: ghcr-secret
          tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "runner"
            effect: "NoSchedule"
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 0  # Run as root to write to /home/runner/models
          containers:
          - name: syncer
            image: ghcr.io/open-edge-platform/dl-streamer-tests/dlstreamer-runner-ubuntu24:latest
            env:
              - name: MASTER_IP
                value: "dls-arl-01"  # Hardcoded hostname
            command: ["bash", "-c"]
            args:
              - |
                # Set HOME to runner user
                export HOME=/home/runner
                
                # Install rsync if missing
                if ! command -v rsync &> /dev/null; then
                  echo "Installing rsync..."
                  apt-get update -qq && apt-get install -y -qq rsync openssh-client > /dev/null 2>&1
                fi
                
                # Configure SSH access - copy to /root/.ssh since we run as root
                mkdir -p /root/.ssh && cp /etc/ssh-key/id_rsa /root/.ssh/id_rsa && chmod 600 /root/.ssh/id_rsa
                
                # SSH options for non-interactive authentication
                SSH_OPTS="-i /root/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o BatchMode=yes"
                
                echo "--- WORKER: Checking if Master is ready ---"
                
                # Check if master finished (max 30 minutes wait)
                COUNTER=0
                MAX_RETRIES=60
                until ssh $SSH_OPTS runner@${MASTER_IP} "test -f /home/runner/models/SUCCESS.txt"; do
                  # Check if master failed
                  if ssh $SSH_OPTS runner@${MASTER_IP} "test -f /home/runner/models/FAILED.txt"; then
                    echo "--- WORKER: Master reported FAILURE ---"
                    ssh $SSH_OPTS runner@${MASTER_IP} "cat /home/runner/models/FAILED.txt"
                    exit 1
                  fi
                  
                  if [ $COUNTER -ge $MAX_RETRIES ]; then
                    echo "--- WORKER: Timeout waiting for master ---"
                    exit 1
                  fi
                  echo "Waiting for master... ($COUNTER/$MAX_RETRIES)"
                  sleep 30
                  COUNTER=$((COUNTER+1))
                done
                
                echo "--- WORKER: Master is ready. Syncing via LAN ---"
                
                rsync -avz --delete --progress -e "ssh $SSH_OPTS" runner@${MASTER_IP}:/home/runner/models/ /home/runner/models/
                
                if [ $? -eq 0 ]; then
                  echo "--- WORKER: Sync complete ---"
                else
                  echo "--- WORKER: Sync failed ---"
                  exit 1
                fi
            volumeMounts:
            - name: host-data
              mountPath: /home/runner/models
            - name: ssh-key
              mountPath: /etc/ssh-key
              readOnly: true
          volumes:
          - name: host-data
            hostPath:
              path: /home/runner/models
              type: DirectoryOrCreate
          - name: ssh-key
            secret:
              secretName: rsync-ssh-secret
